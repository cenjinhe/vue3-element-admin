# user nginx;             # 默认是当前用户名
worker_processes auto;    # 处理的进程数

# 错误日志路径（macOS Homebrew 安装默认路径）
error_log  /opt/homebrew/var/log/nginx/error.log;
# 进程 PID 文件
pid        /opt/homebrew/var/run/nginx.pid;

events {
    # 每个进程最大连接数
    worker_connections 1024;
    # multi_accept on;
}

http {
   # 引入 MIME 类型配置（默认即可）
   include       /opt/homebrew/etc/nginx/mime.types;
   default_type  application/octet-stream;

   # 日志格式设定
   log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

   # 访问日志位置
   access_log  /opt/homebrew/var/log/nginx/access.log;

   # 开启高效文件传输模式
   sendfile        on;
   # 减少网络报文段数量
   tcp_nopush      on;
   # 减少延迟
   tcp_nodelay     on;
   # 连接保持超时时间，单位是秒
   keepalive_timeout  65;

    # 开启 gzip 压缩（优化前端资源加载速度）
    gzip  on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;

   # 核心：vue3-element-admin 项目配置(*重点*)
   # Web 服务的监听配置
   server {
        listen       9200;       # 监听地址及端口，主机ip不加则默认监听全部
        server_name  localhost;  # 站点域名，可以有多个，用空格隔开。（本地测试填 localhost，外网访问填服务器 IP/域名）
        charset utf-8;           # 网页的默认字符集
  
        # 根目录配置（dist的静态文件目录）
        root   /opt/homebrew/var/www/vue3-element-admin/dist;    # 网站根目录默认位置/var/www/html
        index  index.html index.htm;                        # 默认首页文件名

        # 解决 Vue 路由 history 模式下刷新 404 问题
        location / {
            # 尝试加载请求路径，找不到则返回 index.html（Vue 接管路由）
            try_files $uri $uri/ /index.html;
            # 资源缓存控制（静态资源缓存 1 天，html 不缓存）
            if ($request_filename ~* .*\.(html)$) {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
            if ($request_filename ~* .*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$) {
                add_header Cache-Control "max-age=86400";
            }
        }

        # 代理后端接口（关键：解决前端跨域问题，替换为你的真实后端地址）
        # 假设前端请求接口前缀是 /api，代理到后端服务 http://localhost:8000/
        # 我的前缀是 /cjh
        location /cjh/ {
            # 后端接口地址（替换为你的真实后端 IP:端口）
            proxy_pass http://127.0.0.1:5000/cjh/;
            # 传递真实客户端 IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 连接超时时间
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        
        # 内部错误的反馈页面
        error_page   500 502 503 504  /50x.html;
        # 错误页面配置
        location = /50x.html {
            root   html;
        }
    }
}
